<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171B22">
<title>本日の予想</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#171B22; --panel:#1F242D; --panel2:#252B36; --line:#2E3542;
  --ink:#EFEDE8; --dim:#8A93A0; --dim2:#5E6672;
  --hot:#E0A62B; --cold:#4FB477; --signal:#E0362B;
  --b1:#FFFFFF; --b2:#16181C; --b3:#E5312B; --b4:#2B6BE5; --b5:#F2CE1B; --b6:#2FA84F;
  --disp:'Barlow Semi Condensed',system-ui,sans-serif;
  --mono:'Roboto Mono',ui-monospace,monospace;
  --jp:system-ui,-apple-system,'Hiragino Sans','Noto Sans JP',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--jp);
  font-size:15px;line-height:1.6;padding-bottom:56px;overflow-x:hidden}
.wrap{max-width:560px;margin:0 auto;padding:0 12px}

header{display:flex;align-items:baseline;justify-content:space-between;
  padding:18px 0 10px;border-bottom:1px solid var(--line)}
.mark{font-family:var(--disp);font-weight:700;font-size:24px;letter-spacing:.05em}
.mark small{display:block;font-size:10px;color:var(--dim2);letter-spacing:.16em;
  font-weight:500;margin-top:-2px}
.stamp{font-family:var(--mono);font-size:11px;color:var(--dim2);text-align:right}

/* 絞り込み */
.filters{display:flex;gap:6px;padding:12px 0}
.filters button{flex:1;min-width:0;font-family:var(--jp);font-size:12px;
  font-weight:600;background:transparent;color:var(--dim);
  border:1px solid var(--line);border-radius:3px;padding:8px 4px;cursor:pointer}
.filters button.on{background:var(--ink);color:var(--ground);border-color:var(--ink)}

/* 場のアコーディオン */
.venue{border:1px solid var(--line);border-radius:3px;margin-bottom:8px;
  background:var(--panel);overflow:hidden}
.vhead{display:flex;align-items:center;gap:8px;padding:12px 13px;cursor:pointer;
  user-select:none}
.vhead .tri{color:var(--hot);font-size:11px;width:12px;flex:0 0 12px}
.vhead .nm{font-family:var(--disp);font-size:19px;font-weight:600;
  letter-spacing:.02em;color:var(--hot)}
.vhead .sub{font-family:var(--mono);font-size:11px;color:var(--dim2);
  margin-left:auto;text-align:right;white-space:nowrap}

/* レース行 */
.rrow{display:flex;align-items:center;gap:9px;padding:11px 13px;
  border-top:1px solid var(--line)}
.rrow .rno{font-family:var(--disp);font-size:17px;font-weight:600;
  width:34px;flex:0 0 34px}
.rrow .tm{font-family:var(--mono);font-size:11px;color:var(--dim);
  width:42px;flex:0 0 42px}
.bar{flex:1;min-width:0}
.bar .lbl{display:flex;justify-content:space-between;align-items:center;
  gap:6px;margin-bottom:4px}
.bar .who{display:flex;align-items:center;gap:5px;min-width:0}
.bar .pv{font-family:var(--mono);font-size:17px;font-weight:700;
  font-variant-numeric:tabular-nums;line-height:1}
.bar .jd{font-size:11px;font-weight:600;white-space:nowrap}
.bar .track{height:7px;background:#2A3038;border-radius:4px;overflow:hidden}
.bar .fill{height:100%;border-radius:4px}
.bar .sub2{margin-top:3px;font-family:var(--mono);font-size:10px;
  color:var(--dim2)}
.open{flex:0 0 40px;font-family:var(--jp);font-size:11px;font-weight:600;
  background:transparent;color:var(--dim);border:1px solid var(--line);
  border-radius:3px;padding:7px 0;cursor:pointer;line-height:1.2}
.open.on{background:var(--ink);color:var(--ground);border-color:var(--ink)}

/* 詳細 */
.detail{border-top:1px solid var(--line);background:var(--panel2);padding:12px 13px}
.detail .rname{font-size:11px;color:var(--dim2);margin-bottom:9px}
.boat{display:flex;align-items:center;gap:8px;padding:6px 0}
.n{width:20px;height:20px;flex:0 0 20px;border-radius:2px;font-family:var(--mono);
  font-size:12px;font-weight:700;display:grid;place-items:center;color:#101216}
.n.c1{background:var(--b1)} .n.c2{background:var(--b2);color:#E8E8E8;
  box-shadow:inset 0 0 0 1px #4A505C}
.n.c3{background:var(--b3);color:#fff} .n.c4{background:var(--b4);color:#fff}
.n.c5{background:var(--b5)} .n.c6{background:var(--b6);color:#fff}
.boat .who{flex:1;min-width:0;font-size:13px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.boat .who em{font-style:normal;color:var(--dim2);font-size:10px;margin-left:5px}
.boat .pb{width:74px;flex:0 0 74px;height:5px;background:#2A3038;border-radius:3px;
  overflow:hidden}
.boat .pb i{display:block;height:100%;background:var(--ink)}
.boat .pv{width:42px;flex:0 0 42px;text-align:right;font-family:var(--mono);
  font-size:13px;font-variant-numeric:tabular-nums}
.boat{border-bottom:1px solid var(--line);padding:9px 0}
.boat:last-of-type{border-bottom:0}
.bhead{display:flex;align-items:center;gap:8px}
.why{margin:6px 0 0 28px;font-size:11px;line-height:1.9;color:var(--dim)}
.why i{font-style:normal;display:inline-block;font-family:var(--mono);
  font-size:10px;width:16px;text-align:center}
.why i.u{color:var(--cold)} .why i.d{color:var(--signal)}
.why b{color:var(--ink);font-weight:500}
.dh{font-family:var(--disp);font-size:12px;letter-spacing:.16em;color:var(--dim2);
  margin:16px 0 8px;font-weight:600}
table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:11px}
th,td{padding:5px 1px;text-align:center;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left;width:58px;font-family:var(--jp);
  font-size:10px;color:var(--dim2)}
td.best{color:var(--cold);font-weight:700}
td.worst{color:var(--dim2)}
.legend{margin-top:9px;font-size:10px;color:var(--dim2);line-height:1.8}

.empty{color:var(--dim2);font-size:13px;padding:26px 0;text-align:center}
footer{margin-top:24px;padding:14px 0 0;border-top:1px solid var(--line);
  font-size:11px;color:var(--dim2);line-height:1.8}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="mark">本日の予想<small>YOSOU</small></div>
  <div class="stamp" id="stamp">—</div>
</header>

<div class="filters">
  <button data-f="all" class="on">すべて</button>
  <button data-f="hard">堅い順</button>
  <button data-f="open">荒れ順</button>
  <button data-f="expand">場を全部ひらく</button>
</div>

<div id="list"></div>

<footer>
  <b style="color:var(--dim)">オッズ・展示タイム・進入コースは使っていません。</b>
  出走表・今節成績・コース別成績だけで各艇の1着確率を出しています。<br>
  検証34,018レースでの実力: このモデル 対数損失1.204 / 枠番だけ 1.409 /
  <b>市場(オッズ) 約1.146</b>。<br>
  <b style="color:var(--dim)">オッズには勝てません。</b>
  レース当日のオッズを見た方が正確です。これはオッズが出る前に
  各艇の実力を眺めるための道具です。<br>
  確率は較正済み(予想24%→実測24%)。表示どおりの割合で当たります。
</footer>

</div>

<script>
const DATA='data.json';
let D=null, mode='all', openV={}, openR={};
const pc=x=>(x*100).toFixed(0)+'%';
const esc=s=>(s||'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));

function heat(p){                       // 本命の確率で色を決める
  if(p>=.55) return 'var(--cold)';      // 抜けている
  if(p>=.38) return 'var(--hot)';
  return 'var(--signal)';               // 混戦
}
function judge(p){
  if(p>=.55) return '堅い';
  if(p>=.38) return '中位';
  return '混戦';
}

function detail(r){
  const bs=[...r.boats].sort((a,b)=>b.p-a.p);
  const mx=bs[0].p||1;
  const rows=bs.map(b=>{
    const w=(b.why||[]).map(z=>
      `<i class="${z.d>0?'u':'d'}">${z.d>0?'▲':'▼'}</i>${z.k}`+
      (z.v?` <b>${z.v}</b>`:'')+(z.note?`　${z.note}`:'')).join('<br>');
    return `<div class="boat">
      <div class="bhead">
        <i class="n c${b.lane}">${b.lane}</i>
        <span class="who">${esc(b.name)||'—'}<em>${b.cls||''}</em></span>
        <span class="pb"><i style="width:${(b.p/mx*100).toFixed(0)}%"></i></span>
        <span class="pv">${pc(b.p)}</span>
      </div>${w?`<div class="why">${w}</div>`:''}
    </div>`;}).join('');

  const L=[...r.boats].sort((a,b)=>a.lane-b.lane);
  const fmt={p:v=>v==null?'—':pc(v), nwin:v=>v==null?'—':v.toFixed(2),
             tok:v=>v==null?'—':v.toFixed(2), st:v=>v==null?'—':v.toFixed(2),
             cwin:v=>v==null?'—':v.toFixed(0)+'%',
             m2:v=>v==null?'—':(v*100).toFixed(0)+'%',
             srank:v=>v==null?'—':String(v)};
  const small={st:1,srank:1};
  function line(label,key){
    const vs=L.map(b=>b[key]);
    const ok=vs.filter(v=>v!=null);
    if(!ok.length) return '';
    const hi=small[key]?Math.min(...ok):Math.max(...ok);
    const lo=small[key]?Math.max(...ok):Math.min(...ok);
    return `<tr><td>${label}</td>`+vs.map(v=>{
      const c=v==null?'':(v===hi?'best':(v===lo?'worst':''));
      return `<td class="${c}">${(fmt[key]||String)(v)}</td>`;
    }).join('')+`</tr>`;
  }
  const head=`<tr><th></th>`+L.map(b=>
    `<th><i class="n c${b.lane}" style="margin:0 auto">${b.lane}</i></th>`).join('')+`</tr>`;
  const cls=`<tr><td>級別</td>`+L.map(b=>`<td>${b.cls||'—'}</td>`).join('')+`</tr>`;

  return `<div class="detail">
    <div class="rname">${esc(r.name)||'—'}　${r.close?'本場締切 '+r.close:''}</div>
    ${rows}
    <div class="dh">データ比較</div>
    <table><thead>${head}</thead><tbody>
      ${line('1着確率','p')}${line('全国勝率','nwin')}${line('今節得点率','tok')}
      ${line('今節ST','st')}${line('コース1着率','cwin')}${line('モーター','m2')}
      ${cls}${line('今節順位','srank')}
    </tbody></table>
    <div class="legend">緑=6艇で最良　灰=最下位クラス<br>
      今節の項目は初日には出ません(—になります)</div>
  </div>`;
}

function raceRow(v,r){
  const key=v.jcd+'-'+r.rno, on=openR[key];
  const tp=r.top_p!=null?r.top_p:r.p1, tl=r.top_lane||1;
  const col=heat(tp);
  return `<div class="rrow">
      <span class="rno">${r.rno}R</span>
      <span class="tm">${r.net||r.close||'—'}</span>
      <span class="bar">
        <span class="lbl">
          <span class="who"><i class="n c${tl}">${tl}</i>
            <b class="pv" style="color:${col}">${pc(tp)}</b></span>
          <span class="jd" style="color:${col}">${judge(tp)}</span>
        </span>
        <span class="track"><i class="fill"
          style="width:${(tp*100).toFixed(0)}%;background:${col}"></i></span>
        <span class="sub2">1号艇 ${pc(r.p1)}</span>
      </span>
      <button class="open ${on?'on':''}" onclick="tglR('${key}')">${on?'閉じる':'見る'}</button>
    </div>${on?detail(r):''}`;
}

function render(){
  const el=document.getElementById('list');
  if(!D||!D.venues||!D.venues.length){
    el.innerHTML=`<div class="empty">本日の開催データがありません。<br>
      朝の更新をお待ちください。</div>`;
    return;
  }
  document.getElementById('stamp').innerHTML=
    (D.date||'').replace(/(\d{4})(\d\d)(\d\d)/,'$1-$2-$3')+'<br>'+(D.updated||'');

  let vs=D.venues.map(v=>({...v}));
  if(mode==='hard'||mode==='open'){
    vs.forEach(v=>{
      const tp=r=>r.top_p!=null?r.top_p:r.p1;
      v.races=[...v.races].sort((a,b)=> mode==='hard'? tp(b)-tp(a) : tp(a)-tp(b));
    });
    vs.sort((a,b)=>{
      const f=x=>x.races.length?(x.races[0].top_p??x.races[0].p1):0;
      return mode==='hard'? f(b)-f(a) : f(a)-f(b);
    });
  }

  el.innerHTML=vs.map(v=>{
    const on=openV[v.jcd];
    const avg=v.races.reduce((s,r)=>s+(r.top_p??r.p1),0)/Math.max(v.races.length,1);
    return `<div class="venue">
      <div class="vhead" onclick="tglV(${v.jcd})">
        <span class="tri">${on?'▼':'▶'}</span>
        <span class="nm">${v.venue}</span>
        <span class="sub">${v.races.length}R　${v.day_no?v.day_no+'日目':''}<br>
本命 平均${pc(avg)}</span>
      </div>
      ${on?v.races.map(r=>raceRow(v,r)).join(''):''}
    </div>`;
  }).join('');
}

function tglV(j){openV[j]=!openV[j];render();}
function tglR(k){openR[k]=!openR[k];render();}

document.querySelectorAll('.filters button').forEach(b=>{
  b.onclick=()=>{
    const f=b.dataset.f;
    if(f==='expand'){
      const any=Object.values(openV).some(Boolean);
      (D?.venues||[]).forEach(v=>openV[v.jcd]=!any);
      render(); return;
    }
    mode=f;
    document.querySelectorAll('.filters button').forEach(x=>
      x.classList.toggle('on', x.dataset.f===f));
    render();
  };
});

async function pull(){
  try{
    const r=await fetch(DATA+'?t='+Date.now(),{cache:'no-store'});
    if(!r.ok) throw 0;
    D=await r.json();
    if(D.venues && D.venues.length) openV[D.venues[0].jcd]=true;
    render();
  }catch(e){
    document.getElementById('list').innerHTML=
      `<div class="empty">データを読み込めません。<br>
       data.json が同じ場所にあるか確認してください。</div>`;
  }
}
pull();
</script>
</body>
</html>
