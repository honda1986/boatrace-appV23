<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171B22">
<title>本日の予想</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#171B22; --panel:#1F242D; --panel2:#252B36; --line:#2E3542;
  --ink:#EFEDE8; --dim:#8A93A0; --dim2:#5E6672;
  --hot:#E0A62B; --cold:#4FB477; --signal:#E0362B;
  --b1:#FFFFFF; --b2:#16181C; --b3:#E5312B; --b4:#2B6BE5; --b5:#F2CE1B; --b6:#2FA84F;
  --disp:'Barlow Semi Condensed',system-ui,sans-serif;
  --mono:'Roboto Mono',ui-monospace,monospace;
  --jp:system-ui,-apple-system,'Hiragino Sans','Noto Sans JP',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--jp);
  font-size:15px;line-height:1.6;padding-bottom:56px;overflow-x:hidden}
.wrap{max-width:560px;margin:0 auto;padding:0 12px}

header{display:flex;align-items:baseline;justify-content:space-between;
  padding:18px 0 10px;border-bottom:1px solid var(--line)}
.mark{font-family:var(--disp);font-weight:700;font-size:24px;letter-spacing:.05em}
.mark small{display:block;font-size:10px;color:var(--dim2);letter-spacing:.16em;
  font-weight:500;margin-top:-2px}
.stamp{font-family:var(--mono);font-size:11px;color:var(--dim2);text-align:right}

/* 絞り込み */
.filters{display:flex;gap:6px;padding:12px 0}
.filters{flex-wrap:wrap}
.filters button{flex:1 1 22%;min-width:0;font-family:var(--jp);font-size:12px;
  font-weight:600;background:transparent;color:var(--dim);
  border:1px solid var(--line);border-radius:3px;padding:8px 4px;cursor:pointer}
.filters button.on{background:var(--ink);color:var(--ground);border-color:var(--ink)}

/* 場のアコーディオン */
.venue{border:1px solid var(--line);border-radius:3px;margin-bottom:8px;
  background:var(--panel);overflow:hidden}
.vhead{display:flex;align-items:center;gap:8px;padding:12px 13px;cursor:pointer;
  user-select:none}
.vhead .tri{color:var(--hot);font-size:11px;width:12px;flex:0 0 12px}
.vhead .nm{font-family:var(--disp);font-size:19px;font-weight:600;
  letter-spacing:.02em;color:var(--hot)}
.vhead .sub{font-family:var(--mono);font-size:11px;color:var(--dim2);
  margin-left:auto;text-align:right;white-space:nowrap}

/* レース行 */
.rrow{display:flex;align-items:center;gap:9px;padding:11px 13px;
  border-top:1px solid var(--line)}
.rrow .rno{font-family:var(--disp);font-size:17px;font-weight:600;
  width:34px;flex:0 0 34px}
.rrow .tm{font-family:var(--mono);font-size:11px;color:var(--dim);
  width:42px;flex:0 0 42px}
.bar{flex:1;min-width:0}
.bar .lbl{display:flex;justify-content:space-between;align-items:center;
  gap:6px;margin-bottom:4px}
.bar .who{display:flex;align-items:center;gap:5px;min-width:0}
.bar .pv{font-family:var(--mono);font-size:17px;font-weight:700;
  font-variant-numeric:tabular-nums;line-height:1}
.bar .jd{font-size:11px;font-weight:600;white-space:nowrap}
.bar .track{height:7px;background:#2A3038;border-radius:4px;overflow:hidden}
.bar .fill{height:100%;border-radius:4px}
.bar .sub2{display:block;margin-top:3px;font-family:var(--mono);font-size:11px;
  color:var(--dim2);line-height:1.5;word-break:break-all}
.open{flex:0 0 40px;font-family:var(--jp);font-size:11px;font-weight:600;
  background:transparent;color:var(--dim);border:1px solid var(--line);
  border-radius:3px;padding:7px 0;cursor:pointer;line-height:1.2}
.open.on{background:var(--ink);color:var(--ground);border-color:var(--ink)}

/* 詳細 */
.detail{border-top:1px solid var(--line);background:var(--panel2);padding:12px 13px}
.detail .rname{font-size:11px;color:var(--dim2);margin-bottom:9px}
/* 旧レイアウトは廃止(下の .boat/.bhead を使う) */
.n{width:20px;height:20px;flex:0 0 20px;border-radius:2px;font-family:var(--mono);
  font-size:12px;font-weight:700;display:grid;place-items:center;color:#101216}
.n.c1{background:var(--b1)} .n.c2{background:var(--b2);color:#E8E8E8;
  box-shadow:inset 0 0 0 1px #4A505C}
.n.c3{background:var(--b3);color:#fff} .n.c4{background:var(--b4);color:#fff}
.n.c5{background:var(--b5)} .n.c6{background:var(--b6);color:#fff}
.bhead .who{flex:1;min-width:0;font-size:13px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.bhead .who em{font-style:normal;color:var(--dim2);font-size:10px;margin-left:5px}
.bhead .pb{width:64px;flex:0 0 64px;height:5px;background:#2A3038;
  border-radius:3px;overflow:hidden}
.bhead .pb i{display:block;height:100%;background:var(--ink)}
.bhead .pv{width:42px;flex:0 0 42px;text-align:right;font-family:var(--mono);
  font-size:14px;font-variant-numeric:tabular-nums}
.rates{margin:4px 0 0 28px;font-family:var(--mono);font-size:10px;
  color:var(--dim2);display:flex;gap:8px;flex-wrap:wrap}
.rates b{color:var(--dim);font-weight:500}
.cmb{margin-top:6px}
.cmb .row{display:flex;align-items:center;gap:7px;padding:3px 0;font-size:12px}
.cmb .cc{display:flex;gap:2px}
.cmb .cp{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--dim)}
.cmb .n{width:17px;height:17px;flex:0 0 17px;font-size:11px}
.buy{margin-top:7px}
.buy .row{display:flex;align-items:center;gap:7px;padding:5px 0;font-size:12px;
  border-bottom:1px solid var(--line)}
.buy .row:last-child{border-bottom:0}
.buy .cc{display:flex;gap:2px}
.buy .od{font-family:var(--mono);font-size:11px;color:var(--dim2);
  margin-left:auto}
.buy .yen{font-family:var(--mono);font-size:13px;width:58px;flex:0 0 58px;
  text-align:right}
.buy .tot{display:flex;justify-content:space-between;align-items:baseline;
  margin-top:8px;padding-top:8px;border-top:1px solid var(--line);
  font-family:var(--mono);font-size:12px;color:var(--dim)}
.buy .tot b{font-size:16px;color:var(--cold)}
.oat{display:block;margin:-4px 0 6px;font-family:var(--mono);font-size:10px;
  letter-spacing:0;color:var(--dim2)}
.boat{display:block;border-bottom:1px solid var(--line);padding:9px 0}
.boat:last-of-type{border-bottom:0}
.bhead{display:flex;align-items:center;gap:8px;width:100%}
.why{display:block;margin:7px 0 0 28px;font-size:11px;line-height:1.8;
  color:var(--dim)}
.why div{padding-left:16px;text-indent:-16px;margin-bottom:2px}
.why i{font-style:normal;display:inline-block;font-family:var(--mono);
  font-size:10px;width:16px;text-align:left;text-indent:0}
.why i.u{color:var(--cold)} .why i.d{color:var(--signal)}
.why b{color:var(--ink);font-weight:500}
.dh{font-family:var(--disp);font-size:12px;letter-spacing:.16em;color:var(--dim2);
  margin:16px 0 8px;font-weight:600}
table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:11px}
th,td{padding:5px 1px;text-align:center;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left;width:58px;font-family:var(--jp);
  font-size:10px;color:var(--dim2)}
td.best{color:var(--cold);font-weight:700}
td.worst{color:var(--dim2)}
.legend{margin-top:9px;font-size:10px;color:var(--dim2);line-height:1.8}
.shin{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.shin .ip{display:flex;gap:7px;margin:7px 0}
.shin input{flex:1;min-width:0;padding:9px 10px;font-family:var(--mono);
  font-size:16px;font-weight:700;letter-spacing:.28em;border-radius:3px;
  border:1px solid var(--line);background:#1A1F27;color:var(--ink)}
.shin button{flex:0 0 72px;font-size:12px;font-weight:600;border-radius:3px;
  border:1px solid var(--hot);background:transparent;color:var(--hot);
  cursor:pointer;font-family:var(--jp)}
.shin .out{margin-top:9px}
.shin .r{display:flex;align-items:center;gap:7px;padding:4px 0;font-size:12px}
.shin .r .co{font-family:var(--mono);font-size:10px;color:var(--dim2);
  width:34px;flex:0 0 34px}
.shin .r .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.shin .r .v{font-family:var(--mono);font-size:13px;width:44px;flex:0 0 44px;
  text-align:right}
.shin .r .d{font-family:var(--mono);font-size:11px;width:48px;flex:0 0 48px;
  text-align:right}
.shin .up{color:var(--cold)} .shin .dn{color:var(--signal)}
.shin .err{color:var(--signal);font-size:11px;margin-top:5px}
.res{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.res .rh{font-family:var(--disp);font-size:12px;letter-spacing:.16em;
  color:var(--dim2);margin-bottom:8px;font-weight:600}
.res .ord{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.res .ar{color:var(--dim2);font-family:var(--mono);font-size:11px}
.res .pay{margin-top:8px;font-family:var(--mono);font-size:20px;font-weight:700;
  font-variant-numeric:tabular-nums}
.res .hit{color:var(--cold)} .res .miss{color:var(--dim)}
.res .note{margin-top:5px;font-size:11px;color:var(--dim2);line-height:1.7}
.rk{font-family:var(--mono);font-size:9px;color:var(--dim2);
  border:1px solid var(--line);border-radius:2px;padding:1px 4px}

.empty{color:var(--dim2);font-size:13px;padding:26px 0;text-align:center}
footer{margin-top:24px;padding:14px 0 0;border-top:1px solid var(--line);
  font-size:11px;color:var(--dim2);line-height:1.8}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="mark">本日の予想<small>YOSOU</small></div>
  <div class="stamp" id="stamp">—</div>
</header>

<div class="filters">
  <button data-f="all" class="on">すべて</button>
  <button data-f="hard">堅い順</button>
  <button data-f="open">荒れ順</button>
  <button data-f="shobu">🔥 勝負のみ</button>
  <button data-f="expand">場を全部ひらく</button>
</div>

<div id="list"></div>

<footer>
  <b style="color:var(--dim)">オッズ・展示タイム・進入コースは使っていません。</b>
  出走表・今節成績・コース別成績だけで各艇の1着確率を出しています。<br>
  検証34,018レースでの実力: このモデル 対数損失1.204 / 枠番だけ 1.409 /
  <b>市場(オッズ) 約1.146</b>。<br>
  <b style="color:var(--dim)">オッズには勝てません。</b>
  レース当日のオッズを見た方が正確です。これはオッズが出る前に
  各艇の実力を眺めるための道具です。<br>
  確率は較正済み(予想24%→実測24%)。表示どおりの割合で当たります。
</footer>

</div>

<script>
const DATA='data.json';
let D=null, mode='all', openV={}, openR={};
const pc=x=>(x*100).toFixed(0)+'%';
const yen=n=>n==null?'—':Number(n).toLocaleString('ja-JP');
const esc=s=>(s||'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));

function heat(p){                       // 本命の確率で色を決める
  if(p>=.55) return 'var(--cold)';      // 抜けている
  if(p>=.38) return 'var(--hot)';
  return 'var(--signal)';               // 混戦
}
function judge(p){
  if(p>=.55) return '堅い';
  if(p>=.38) return '中位';
  return '混戦';
}

function detail(r){
  const bs=[...r.boats].sort((a,b)=>b.p-a.p);
  const mx=bs[0].p||1;
  const rows=bs.map(b=>{
    const w=(b.why||[]).map(z=>
      `<div><i class="${z.d>0?'u':'d'}">${z.d>0?'▲':'▼'}</i>${z.k}`+
      (z.v?` <b>${z.v}</b>`:'')+(z.note?` ${z.note}`:'')+`</div>`).join('');
    const rt = b.t3!=null ? `<div class="rates">
        <span>1着 <b>${pc(b.p)}</b></span>
        <span>2着 <b>${pc(b.p2)}</b></span>
        <span>3着 <b>${pc(b.p3)}</b></span>
        <span>2連対 <b>${pc(b.t2)}</b></span>
        <span>3連対 <b>${pc(b.t3)}</b></span></div>` : '';
    return `<div class="boat">
      <div class="bhead">
        <i class="n c${b.lane}">${b.lane}</i>
        <span class="who">${esc(b.name)||'—'}<em>${b.cls||''}</em></span>
        <span class="pb"><i style="width:${(b.p/mx*100).toFixed(0)}%"></i></span>
        <span class="pv">${pc(b.p)}</span>
      </div>${rt}${w?`<div class="why">${w}</div>`:''}
    </div>`;}).join('');

  const L=[...r.boats].sort((a,b)=>a.lane-b.lane);
  const fmt={p:v=>v==null?'—':pc(v), t2:v=>v==null?'—':pc(v),
             t3:v=>v==null?'—':pc(v), nwin:v=>v==null?'—':v.toFixed(2),
             tok:v=>v==null?'—':v.toFixed(2), st:v=>v==null?'—':v.toFixed(2),
             cwin:v=>v==null?'—':v.toFixed(0)+'%',
             m2:v=>v==null?'—':(v*100).toFixed(0)+'%',
             srank:v=>v==null?'—':String(v)};
  const small={st:1,srank:1};
  function line(label,key){
    const vs=L.map(b=>b[key]);
    const ok=vs.filter(v=>v!=null);
    if(!ok.length) return '';
    const hi=small[key]?Math.min(...ok):Math.max(...ok);
    const lo=small[key]?Math.max(...ok):Math.min(...ok);
    const flat=(hi===lo);           // 全艇同じ値なら色を付けない
    return `<tr><td>${label}</td>`+vs.map(v=>{
      const c=(v==null||flat)?'':(v===hi?'best':(v===lo?'worst':''));
      return `<td class="${c}">${(fmt[key]||String)(v)}</td>`;
    }).join('')+`</tr>`;
  }
  const head=`<tr><th></th>`+L.map(b=>
    `<th><i class="n c${b.lane}" style="margin:0 auto">${b.lane}</i></th>`).join('')+`</tr>`;
  const cls=`<tr><td>級別</td>`+L.map(b=>`<td>${b.cls||'—'}</td>`).join('')+`</tr>`;

  return `<div class="detail">
    <div class="rname">${esc(r.name)||'—'}　${r.close?'本場締切 '+r.close:''}</div>
    ${rows}
    ${buylist(r)}
    ${r.shobu?`<div class="dh" style="color:var(--hot)">🔥 勝負レース</div>
      <div class="legend" style="margin:0 0 8px">
      ①上位8組に確率が集中していて(全体の約10%)、
      ②確率5%以上の組を払戻均等で買ったとき、
      1万円あたりの払戻が15,000〜20,000円に収まるレース。<br>
      検証34,018レースでの実測(1,333レース):
      <b style="color:var(--ink)">的中率53.5% / 回収率89.6%</b>
      (誤差±2.3%)。年度別も91.6/87.3/90.2%でそろっています。
      <b style="color:var(--ink)">それでも80%です。</b></div>`:''}
    ${combos(r)}
    <div class="dh">データ比較</div>
    <table><thead>${head}</thead><tbody>
      ${line('1着確率','p')}${line('2連対率','t2')}${line('3連対率','t3')}${line('全国勝率','nwin')}${line('今節得点率','tok')}
      ${line('今節ST','st')}${line('コース1着率','cwin')}${line('モーター','m2')}
      ${cls}${line('今節順位','srank')}
    </tbody></table>
    <div class="legend">緑=6艇で最良　灰=最下位クラス<br>
      今節の項目は初日には出ません(—になります)</div>
    ${shinnyu(r)}
    ${result(r)}
  </div>`;
}

function buylist(r){
  if(!r.buy||!r.buy.length) return '';
  const rows=r.buy.map(z=>{
    const cc=z.c.split('-').map(l=>`<i class="n c${l}">${l}</i>`).join('');
    return `<div class="row"><span class="cc">${cc}</span>
      <span class="od">${z.o.toFixed(1)}倍</span>
      <span class="yen">${yen(z.y)}円</span></div>`;}).join('');
  const tot=r.buy.reduce((s,z)=>s+z.y,0);
  const at=r.odds_at
    ? `<div class="oat">オッズ ${r.odds_at} 時点のもの</div>` : '';
  return `<div class="dh" style="color:var(--hot)">🔥 買い目 ${r.buy.length}点</div>
    ${at}
    <div class="buy">${rows}
      <div class="tot"><span>計 ${yen(tot)}円</span>
        <span>当たれば <b>${yen(r.X)}円</b></span></div>
    </div>
    <div class="legend">確率${((D&&D.buy_p)||0.05)*100}%以上の組を、
      どれが当たっても同じ払戻になるよう配分しています。<br>
      1万円で計算した目安です。100円単位に丸めているので多少ずれます。<br>
      オッズは締切が近づくほど動きます。15分ごとに取り直しています。<br>
      通知は2回。1回目は仮の金額、<b>締切30分前ごろのオッズで送る2回目</b>を
      使ってください。</div>`;
}

function combos(r){
  if(!r.combos||!r.combos.length) return '';
  const rows=r.combos.map(z=>{
    const cc=z.c.split('-').map(l=>`<i class="n c${l}">${l}</i>`).join('');
    return `<div class="row"><span class="cc">${cc}</span>
      <span class="cp">${(z.p*100).toFixed(1)}%</span></div>`;
  }).join('');
  return `<div class="dh">3連単 出やすい順</div><div class="cmb">${rows}</div>`;
}

// コース別の標準的な1着率(枠なり進入のときの目安)
const CBASE=[.55,.14,.12,.11,.06,.02];

function shinnyu(r){
  const id=`sh${r.jcd||0}_${r.rno}`;
  return `<div class="shin">
    <div class="dh" style="margin:0">進入が変わったら</div>
    <div class="legend" style="margin:4px 0 0">
      内側から順に艇番を6桁で入力してください。「312456」＝③①②④⑤⑥の進入。</div>
    <div class="ip">
      <input id="${id}" inputmode="numeric" maxlength="6" placeholder="123456">
      <button onclick="reShin('${id}',${r.jcd||0},${r.rno})">再計算</button>
    </div>
    <div class="out" id="${id}o"></div>
    <div class="legend">
      <b style="color:var(--dim)">これは参考値です。</b>
      モデルは枠番で学習していて、進入コースは使っていません。<br>
      「その艇の強さ ÷ 枠の標準勝率 × 新しいコースの標準勝率」で置き換えた
      近似なので、本来の予想ほどの精度はありません。</div>
  </div>`;
}

function reShin(id,jcd,rno){
  const el=document.getElementById(id), out=document.getElementById(id+'o');
  const t=(el.value||'').replace(/[^1-6]/g,'');
  if(t.length!==6 || new Set(t).size!==6){
    out.innerHTML=`<div class="err">1〜6を1回ずつ、6桁で入れてください</div>`;
    return;
  }
  let race=null;
  (D?.venues||[]).forEach(v=>{ if(v.jcd===jcd)
    v.races.forEach(x=>{ if(x.rno===rno) race=x; }); });
  if(!race){out.innerHTML=`<div class="err">レースが見つかりません</div>`;return;}

  const course={};                       // 艇番 → 進入コース(1が最内)
  [...t].forEach((c,i)=>{course[+c]=i+1;});
  const adj=race.boats.map(b=>{
    const ability=b.p/CBASE[b.lane-1];   // 枠の効果を外した強さ
    return {...b, np: ability*CBASE[course[b.lane]-1], co: course[b.lane]};
  });
  const s=adj.reduce((a,b)=>a+b.np,0)||1;
  adj.forEach(b=>{b.np/=s;});
  adj.sort((a,b)=>b.np-a.np);

  out.innerHTML=adj.map(b=>{
    const d=b.np-b.p, sign=d>0?'up':'dn';
    return `<div class="r">
      <i class="n c${b.lane}">${b.lane}</i>
      <span class="co">${b.co}コース</span>
      <span class="nm">${esc(b.name)||'—'}</span>
      <span class="v">${pc(b.np)}</span>
      <span class="d ${sign}">${d>0?'+':''}${(d*100).toFixed(0)}pt</span>
    </div>`;}).join('');
}

function result(r){
  const x=r.result;
  if(!x) return '';
  const ord=(x.order||[]).map((l,i)=>
    `${i?'<span class="ar">▸</span>':''}<i class="n c${l}">${l}</i>`+
    (x.ranks&&x.ranks[i]?`<span class="rk">予想${x.ranks[i]}位</span>`:'')
  ).join('');
  const inTop = x.rank!=null;
  return `<div class="res">
    <div class="rh">結果</div>
    <div class="ord">${ord}</div>
    <div class="pay ${inTop?'hit':'miss'}">${x.pay!=null?yen(x.pay)+'円':'—'}</div>
    <div class="note">
      ${inTop
        ? (x.by_buy
           ? `買い目 <b style="color:var(--cold)">${x.rank}点目</b>が的中`
             + (x.ret?`　${yen(x.cost)}円 → <b style="color:var(--cold)">`
                      + `${yen(x.ret)}円</b>`:'')
           : `3連単 出やすい順 <b style="color:var(--cold)">${x.rank}位</b>でした`)
        : (x.by_buy ? `買い目${x.n_combos}点には入っていませんでした`
                    : `上位${x.n_combos||8}組には入っていませんでした`)}<br>
      ${x.won?'本命は1着でした':'本命は1着になりませんでした'}
      ${x.henkan?'　※返還あり':''}
    </div>
  </div>`;
}

function raceRow(v,r){
  const key=v.jcd+'-'+r.rno, on=openR[key];
  const tp=r.top_p!=null?r.top_p:r.p1, tl=r.top_lane||1;
  const col=heat(tp);
  return `<div class="rrow ${r.shobu?'shobu':''}">
      <span class="rno">${r.shobu?'🔥':''}${r.rno}R</span>
      <span class="tm">${r.net||r.close||'—'}</span>
      <span class="bar">
        <span class="lbl">
          <span class="who"><i class="n c${tl}">${tl}</i>
            <b class="pv" style="color:${col}">${pc(tp)}</b></span>
          <span class="jd" style="color:${col}">${judge(tp)}</span>
        </span>
        <span class="track"><i class="fill"
          style="width:${(tp*100).toFixed(0)}%;background:${col}"></i></span>
        ${r.result?`<span class="sub2">
          <b style="color:${r.result.rank!=null?'var(--cold)':'var(--dim2)'}">`+
          `${r.result.hit}　${yen(r.result.pay)}円`+
          (r.result.rank!=null
            ? (r.result.by_buy
               ? `　的中${r.result.ret?' '+yen(r.result.ret)+'円':''}`
               : `　${r.result.rank}位`)
            : '')+`</b></span>`:''}
      </span>
      <button class="open ${on?'on':''}" onclick="tglR('${key}')">${on?'閉じる':'見る'}</button>
    </div>${on?detail(r):''}`;
}

function render(){
  const el=document.getElementById('list');
  const ns=(D?.venues||[]).reduce((s,v)=>s+v.races.filter(r=>r.shobu).length,0);
  const sb=document.querySelector('[data-f="shobu"]');
  if(sb) sb.textContent = ns?`🔥 勝負 ${ns}件`:'🔥 勝負 0件';
  if(!D||!D.venues||!D.venues.length){
    el.innerHTML=`<div class="empty">本日の開催データがありません。<br>
      朝の更新をお待ちください。</div>`;
    return;
  }
  document.getElementById('stamp').innerHTML=
    (D.date||'').replace(/(\d{4})(\d\d)(\d\d)/,'$1-$2-$3')+'<br>'+(D.updated||'');

  let vs=D.venues.map(v=>({...v}));
  if(mode==='shobu'){
    vs.forEach(v=>{v.races=v.races.filter(r=>r.shobu);});
    vs=vs.filter(v=>v.races.length);
  }
  if(mode==='hard'||mode==='open'){
    vs.forEach(v=>{
      const tp=r=>r.top_p!=null?r.top_p:r.p1;
      v.races=[...v.races].sort((a,b)=> mode==='hard'? tp(b)-tp(a) : tp(a)-tp(b));
    });
    vs.sort((a,b)=>{
      const f=x=>x.races.length?(x.races[0].top_p??x.races[0].p1):0;
      return mode==='hard'? f(b)-f(a) : f(a)-f(b);
    });
  }

  el.innerHTML=vs.map(v=>{
    const on=openV[v.jcd];
    const avg=v.races.reduce((s,r)=>s+(r.top_p??r.p1),0)/Math.max(v.races.length,1);
    return `<div class="venue">
      <div class="vhead" onclick="tglV(${v.jcd})">
        <span class="tri">${on?'▼':'▶'}</span>
        <span class="nm">${v.venue}</span>
        <span class="sub">${v.races.length}R　${v.day_no?v.day_no+'日目':''}<br>
本命 平均${pc(avg)}</span>
      </div>
      ${on?v.races.map(r=>raceRow(v,{...r,jcd:v.jcd})).join(''):''}
    </div>`;
  }).join('');
}

function tglV(j){openV[j]=!openV[j];render();}
function tglR(k){openR[k]=!openR[k];render();}

document.querySelectorAll('.filters button').forEach(b=>{
  b.onclick=()=>{
    const f=b.dataset.f;
    if(f==='shobu'){
      mode='shobu';
      document.querySelectorAll('.filters button').forEach(x=>
        x.classList.toggle('on', x.dataset.f===f));
      (D?.venues||[]).forEach(v=>openV[v.jcd]=true);
      render(); return;
    }
    if(f==='expand'){
      const any=Object.values(openV).some(Boolean);
      (D?.venues||[]).forEach(v=>openV[v.jcd]=!any);
      render(); return;
    }
    mode=f;
    document.querySelectorAll('.filters button').forEach(x=>
      x.classList.toggle('on', x.dataset.f===f));
    render();
  };
});

async function pull(){
  try{
    const r=await fetch(DATA+'?t='+Date.now(),{cache:'no-store'});
    if(!r.ok) throw 0;
    D=await r.json();
    if(D.venues && D.venues.length) openV[D.venues[0].jcd]=true;
    render();
  }catch(e){
    document.getElementById('list').innerHTML=
      `<div class="empty">データを読み込めません。<br>
       data.json が同じ場所にあるか確認してください。</div>`;
  }
}
pull();
</script>
</body>
</html>
