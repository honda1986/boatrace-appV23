name: 本日の予想
# ★GitHub の定期実行は混む時間に間引かれる（2026-11-18・19 は 8〜12時・14〜16時に起動されず、
#   更新が2〜4時間止まった）。なので1回起きたら最長5時間20分回し続け、時間切れのときは
#   自分で次のジョブを起こす（v24 の予備運転と同じ作り）。毎時の定期実行は保険。
#   回す時間は JST 7:00〜翌0:55。それ以外の時間に起きたら何もせずに終わる。

on:
  workflow_dispatch:
    inputs:
      date:
        description: '対象日 YYYYMMDD(空で本日)'
        required: false
        default: ''
  schedule:
    - cron: '2 22 * * *'
    - cron: '2 23 * * *'
    - cron: '2 0 * * *'
    - cron: '2 1 * * *'
    - cron: '2 2 * * *'
    - cron: '2 3 * * *'
    - cron: '2 4 * * *'
    - cron: '2 5 * * *'
    - cron: '2 6 * * *'
    - cron: '2 7 * * *'
    - cron: '2 8 * * *'
    - cron: '2 9 * * *'
    - cron: '2 10 * * *'
    - cron: '2 11 * * *'
    - cron: '2 12 * * *'
    - cron: '2 13 * * *'
    - cron: '2 14 * * *'
    - cron: '2 15 * * *'

concurrency:
  group: yosou
  cancel-in-progress: false     # 回っているジョブは止めない。後から起きた分は待って、終わったら引き継ぐ

permissions:
  contents: write
  actions: write                # 時間切れのとき次のジョブを起こす

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 依存インストール
        run: pip install requests beautifulsoup4 numpy lightgbm
      - name: v22 の Kファイルを取る
        uses: actions/checkout@v4
        with:
          repository: honda1986/v22
          path: v22src
          sparse-checkout: kfile

      - name: モーター純度を作る
        run: python motor.py --kfile v22src/kfile --days 400

      
      - name: 15分おきにまわす(オッズを取り直すため。最長5時間20分)
        id: loop
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          ARG=""
          if [ -n "${{ github.event.inputs.date }}" ]; then
            ARG="--date ${{ github.event.inputs.date }}"
          fi
          # 回す時間は JST 7:00〜翌0:55。日付を指定した手動実行は時間に関係なく回す
          M=$(( 10#$(TZ=Asia/Tokyo date +%H) * 60 + 10#$(TZ=Asia/Tokyo date +%M) ))
          if [ -z "$ARG" ] && [ $M -ge 55 ] && [ $M -lt 420 ]; then
            echo "時間外(JST $(TZ=Asia/Tokyo date +%H:%M))なので回しません"
            echo "chain=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ $M -lt 55 ]; then CAP=$(TZ=Asia/Tokyo date -d 'today 00:55' +%s)
          else CAP=$(TZ=Asia/Tokyo date -d 'tomorrow 00:55' +%s); fi
          END=$(( $(date +%s) + 320*60 )); [ $END -gt $CAP ] && END=$CAP
          [ -n "$ARG" ] && END=$(( $(date +%s) + 50*60 ))      # 日付を指定した手動実行は前と同じ50分
          echo "JST $(TZ=Asia/Tokyo date -d @$END +%H:%M) まで回します"
          N=0; LASTM=$(date +%s)
          while :; do
            N=$((N+1)); T0=$(date +%s)
            echo "===== 周回 $N  $(TZ=Asia/Tokyo date +%H:%M) ====="
            # 1時間ごとに v22 の Kファイルを取り直してモーター純度を作り直す(前日分は朝9〜10時ごろ届く)
            if [ $(( T0 - LASTM )) -ge 3600 ]; then
              git -C v22src pull -q --ff-only || echo "v22 の Kファイルを取り直せず"
              python motor.py --kfile v22src/kfile --days 400 || echo "モーター純度は前のまま"
              LASTM=$T0
            fi
            python yosou.py $ARG || echo "この周回は失敗。次に進みます。"
            # data.json(いまの日)/ days/(日別の保存)/ history.json(成績と収支)/ races.json(全レースの予想1位・2位と結果)
            git add yosou/data.json yosou/days yosou/history.json yosou/races.json
            if git diff --cached --quiet; then
              echo "変更なし"
            else
              git commit -m "yosou: 更新" -q
              for i in 1 2 3; do
                # history.json がぶつかったらこちらを採る(次の周回で集計し直す)
                if git pull --rebase --autostash -X theirs -q; then
                  git push -q && break
                else
                  git rebase --abort 2>/dev/null || true
                fi
                sleep 5
              done
            fi
            NOW=$(date +%s)
            W=$(( 900 - (NOW - T0) )); [ $W -lt 60 ] && W=60
            # 待ったあとに次の周回を回せるかを先に判定する(待ち損ねてタイムアウトしない)
            if [ $(( NOW + W + 120 )) -ge $END ]; then
              echo "次の周回は時間内に終わらないので、ここで終了します"
              break
            fi
            echo "次の周回まで ${W}秒"
            sleep $W
          done
          echo "ループ終了 (${N}周)"
          # 0:55 より前に時間切れになったら、次のジョブを起こす(日付指定の手動実行は起こさない)
          if [ -z "$ARG" ] && [ $(( $(date +%s) + 1800 )) -lt $CAP ]; then
            echo "chain=1" >> "$GITHUB_OUTPUT"
          else
            echo "chain=0" >> "$GITHUB_OUTPUT"
          fi

      - name: 次のジョブを起こす(時間切れのとき)
        if: steps.loop.outputs.chain == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run yosou.yml --ref "${GITHUB_REF_NAME}"
