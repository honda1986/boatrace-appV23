name: 本日の予想

on:
  workflow_dispatch:
    inputs:
      date:
        description: '対象日 YYYYMMDD(空で本日)'
        required: false
        default: ''
  schedule:
    - cron: '2 22 * * *'
    - cron: '2 23 * * *'
    - cron: '2 0 * * *'
    - cron: '2 1 * * *'
    - cron: '2 2 * * *'
    - cron: '2 3 * * *'
    - cron: '2 4 * * *'
    - cron: '2 5 * * *'
    - cron: '2 6 * * *'
    - cron: '2 7 * * *'
    - cron: '2 8 * * *'
    - cron: '2 9 * * *'
    - cron: '2 10 * * *'
    - cron: '2 11 * * *'
    - cron: '2 12 * * *'
    - cron: '2 13 * * *'
    - cron: '2 14 * * *'
    - cron: '2 15 * * *'

concurrency:
  group: yosou
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 依存インストール
        run: pip install requests beautifulsoup4 numpy lightgbm
      - name: 30分おきに2回まわす
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          ARG=""
          if [ -n "${{ github.event.inputs.date }}" ]; then
            ARG="--date ${{ github.event.inputs.date }}"
          fi
          END=$(( $(date +%s) + 35*60 ))
          N=0
          while :; do
            N=$((N+1)); T0=$(date +%s)
            echo "===== 周回 $N  $(TZ=Asia/Tokyo date +%H:%M) ====="
            python yosou.py $ARG || echo "この周回は失敗。次に進みます。"
            git add yosou/data.json
            if git diff --cached --quiet; then
              echo "変更なし"
            else
              git commit -m "yosou: 更新" -q
              for i in 1 2 3; do
                git pull --rebase --autostash -q && git push -q && break
                sleep 5
              done
            fi
            NOW=$(date +%s)
            [ $NOW -ge $END ] && break
            W=$(( 1800 - (NOW - T0) )); [ $W -lt 60 ] && W=60
            echo "次の周回まで ${W}秒"
            sleep $W
          done
          echo "ループ終了 (${N}周)"
